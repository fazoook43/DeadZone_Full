# LF normalized for GitHub raw
# Example A-only device profile
# Use this as a starting point for devices that have NO A/B slots:
#   - Older Xiaomi / Redmi budget phones
#   - Some MediaTek devices without Virtual A/B
#
# Verify SUPER_SIZE with:   fastboot getvar partition-size:super
# Verify group values with: lpdump <super.img>

DEVICE_CODENAME=aonly_example
DEVICE_BRAND=Xiaomi
DEVICE_SOC=MediaTek

# --- slot mode ---
SUPER_SLOT_MODE=A
SUPER_OUTPUT_FORMAT=sparse
# SUPER_ACTIVE_SLOT is unused for A-only but kept for tooling compatibility
SUPER_ACTIVE_SLOT=a

# --- super metadata ---
SUPER_SIZE=9663676416
SUPER_NAME=super
SUPER_METADATA_SIZE=65536
SUPER_METADATA_SLOTS=2
METADATA_SLOTS=2

# --- A-only group ---
# Single group; name must match what lpdump shows exactly.
DYNAMIC_PARTITION_GROUP_NAME=main
DYNAMIC_PARTITION_GROUP_SIZE=9655287808
PARTITION_SUFFIX=

# AB/VAB fields — unused for A-only, included for compatibility
SUPER_GROUP_BASENAME=main

# --- partitions ---
DYNAMIC_PARTITIONS="system product system_ext vendor odm"

# --- fastboot images ---
REQUIRED_FASTBOOT_IMAGES="boot.img vbmeta.img"
OPTIONAL_FASTBOOT_IMAGES="dtbo.img vbmeta_system.img recovery.img logo.img lk.img tee.img scp.img spmfw.img"
VBMETA_IMAGES="vbmeta.img vbmeta_system.img"

# A-only devices flash to plain partition names (no _a/_b suffix)
FASTBOOT_SLOT_MODE=single
VBMETA_PATCH_STRATEGY=binary
