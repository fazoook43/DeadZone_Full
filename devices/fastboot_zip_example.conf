# Device profile example — fastboot_zip input type
# Copy and rename to devices/<your_codename>.conf
# Fill DEVICE_CODENAME manually (as required by project design).
#
# This profile is for devices where you have a FASTBOOT ZIP (not an OTA).
# The fastboot ZIP must contain images/super.img (standard layout).
#
# SUPER_SIZE will be overridden automatically from the real super.img size.
# SUPER_SLOT_MODE will be auto-detected via lpdump + image name heuristics.
# You only need to set them here if auto-detection is wrong for your device.

# ── Identity ──────────────────────────────────────────────────────────────────
DEVICE_CODENAME=
DEVICE_BRAND=Xiaomi
DEVICE_SOC=

# ── Input type ────────────────────────────────────────────────────────────────
# Set to fastboot_zip when your ROM file is a Fastboot package (images/super.img)
# instead of an OTA ZIP (payload.bin).
INPUT_TYPE=fastboot_zip

# ── Super metadata ────────────────────────────────────────────────────────────
# SUPER_SIZE: Leave blank to auto-read from the real super.img file.
#             Set explicitly if auto-read is wrong (e.g. you want to resize).
SUPER_SIZE=

# Slot mode: auto-detected from lpdump + image names.
# Override here if detection is wrong:
#   A   → A-only (legacy, no slots)
#   AB  → Standard A/B (Treble, no virtual-ab)
#   VAB → Virtual A/B (most modern Xiaomi/HyperOS Snapdragon + MediaTek)
# SUPER_SLOT_MODE=VAB

SUPER_OUTPUT_FORMAT=sparse
SUPER_ACTIVE_SLOT=a
SUPER_GROUP_BASENAME=qti_dynamic_partitions
DYNAMIC_PARTITION_GROUP_NAME=
DYNAMIC_PARTITION_GROUP_SIZE=
SUPER_METADATA_SIZE=65536
SUPER_METADATA_SLOTS=2
METADATA_SLOTS=2
SUPER_NAME=super
PARTITION_SUFFIX=_a

# DYNAMIC_PARTITIONS: list of partition names to extract and repack into super.
# Adjust for your device — remove any that don't exist in your ROM.
DYNAMIC_PARTITIONS="system product system_ext vendor vendor_dlkm system_dlkm odm odm_dlkm mi_ext"

# ── Fastboot image lists ───────────────────────────────────────────────────────
REQUIRED_FASTBOOT_IMAGES="boot.img init_boot.img vendor_boot.img vbmeta.img"
OPTIONAL_FASTBOOT_IMAGES="dtbo.img vbmeta_system.img vbmeta_vendor.img vendor_kernel_boot.img recovery.img logo.img lk.img tee.img scp.img spmfw.img audio_dsp.img dpm.img mcupm.img pi_img.img gz.img md1img.img my_bigball.img my_carrier.img my_company.img my_engineering.img my_heytap.img my_manifest.img my_preload.img my_product.img my_region.img my_stock.img"
VBMETA_IMAGES="vbmeta.img vbmeta_system.img vbmeta_vendor.img"
FASTBOOT_SLOT_MODE=ab_suffix
VBMETA_PATCH_STRATEGY=binary
